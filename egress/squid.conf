# Egress proxy for the workers: their only way to the internet. HTTPS tunnels to the git hosts, nothing else.
# git_hosts must equal ALLOWED_HOSTS in app/repo_url/allowed_hosts.py (tests/test_egress_allowlist.py checks it).
http_port 3128

acl git_hosts dstdomain github.com gitlab.com bitbucket.org
acl https_port port 443
acl CONNECT method CONNECT

http_access deny CONNECT !https_port
http_access allow CONNECT git_hosts
http_access deny all

# A pass-through, not a cache: it never stores repo content.
cache deny all

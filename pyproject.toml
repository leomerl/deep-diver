[project]
name = "deep-diver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.11.0",
    "claude-agent-sdk>=0.2.186",
    "cryptography>=50.0.2",
    "fastapi>=0.165.0",
    "griffe>=2.4.1",
    "grimp>=3.20",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "langchain-core>=1.8.3",
    "langgraph>=1.2.23",
    "langgraph-checkpoint-postgres>=3.2.1",
    "minio>=7.2.20",
    "networkx>=3.7",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
]  # added per step, as each piece needs them

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
